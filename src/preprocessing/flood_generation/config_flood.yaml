# Example configuration for flood generation
input:
  dem: D:/luuvinhloi/PycharmProjects/BTS_Restoration_Project/data/cleaned/elev_hue_clean.tif
  roads: D:/luuvinhloi/PycharmProjects/BTS_Restoration_Project/data/cleaned/roads_hue_clean.geojson
  boundary: D:/luuvinhloi/PycharmProjects/BTS_Restoration_Project/data/cleaned/hue_boundary_clean.geojson
  # optional:
  impervious: null
output:
  outdir: D:/luuvinhloi/PycharmProjects/BTS_Restoration_Project/data/processed/flood
scenarios:
  - m: 0.5
  - m: 1.0
  - m: 1.5
  - m: 2.0

sampling_m: 5          # meters between samples on road segments
dem_resample: null     # null to keep native resolution, or a number in meters
remove_small_polygons_m2: 50

flow_accumulation:
  enabled: false
  method: pysheds    # or 'richdem'
  accumulation_threshold: 500

traversability_thresholds:
  ok: 0.2
  partial: 0.5
  blocked: 9999

verbose: true
