# =============================================================
# CẤU HÌNH CHUNG CHO TOÀN BỘ PIPELINE
# =============================================================

method: "GA_PSO"                # "MILP" hoặc "GA_PSO"

damage_rate: 0.85
population_sample_limit: 2000
candidate_max: 1000
M_max: 20
budget_max: 1e19
cover_ratio: 1.0
seed: 42

endurance_mode: "none"
required_broadcast_time_h: 0

default_R: 3000
default_cost: 2e7
default_setup_time_h: 0.5

slope_threshold_deg: 50
road_buffer_m: 500
candidate_radius_m: 500
candidate_per_bts: 3

# =============================================================
# THAM SỐ I/J FEATURE EXTRACTION
# =============================================================
feature_extraction:
  pop_threshold: 3
  eps_dbscan_m: 1200
  db_min_samples: 2

  default_R: 3000
  infra_buffer_m: 1500

  candidate_per_cluster: 30
  candidate_jitter_m: 600
  road_buffer_m: 5000
  slope_threshold_deg: 35
  candidate_samples_global: 10000

  max_I: 1500
  max_J: 1200
  seed: 42

# =============================================================
# PHƯƠNG PHÁP 1 – MILP
# =============================================================
milp:
  solver:
    engine: "gurobi"
    time_limit: 1000

  weights:
    w_time: 0.05
    w_cost: 0.1

  simulation:
    enable: true
    scenario: "standard"
    visualize: true

# =============================================================
# PHƯƠNG PHÁP 2 – GA-PSO LAI
# =============================================================
ga_pso:
  runs: 1
  pop_size: 100
  max_iter: 200
  mutation_rate: 0.08
  ga_period: 10
  elitism: 0.1

  cost_per_km_factor: 0.2
  max_slope_deg: 15.0

  weights:
    w_time: 0.2
    w_cost: 0.4

  coverage_weight: 0.5

  # =========================================================
  # NGƯỠNG NGẬP LỤT — ĐƯỢC THÊM MỚI ĐỂ KHẮC PHỤC LỖI
  # =========================================================
  flood_depth_threshold_m: 0.5     # NGƯỠNG CHUẨN: 0.5 m

  output_dir: "outputs/results_ga_pso"

  simulation:
    enable: true
    scenario: "dynamic_coverage"
    visualize: true

# =============================================================
# DỮ LIỆU ĐẦU VÀO — REQUIRED BY GA-PSO SOLVER
# =============================================================
data_paths:
  J_sites: "data/processed/position_I_J/J_sites.csv"
  cow_dataset: "data/processed/cow/cow_dataset.csv"
  backup_power: "data/processed/backup_power/backup_power.csv"
  failed_bts: "data/processed/damage_bts/failed_bts.csv"

  flood_tif: "data/processed/flood/flood_depth_combined_B_clean.tif"
  roads_graphml: "data/processed/road/roads_flooded.graphml"

  cow_to_J: "data/processed/travel_cost/cow_to_J_sites.csv"
  backup_to_bts: "data/processed/travel_cost/backup_to_failed_bts.csv"
